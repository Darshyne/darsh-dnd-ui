# Lance les tests (`npm test`, Vitest) à chaque push sur main et à chaque pull request.
# Le résultat s'affiche à côté de chaque commit sur GitHub et alimente le badge « Tests » du README.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le contrat avec le moteur (tests/core-contract.test.mjs) lit docs/reference/surface.json de dnd5e-combat :
      # on ne récupère que ce dossier (les tests du moteur ne doivent pas tourner ici).
      - uses: actions/checkout@v4
        with:
          repository: Darshyne/dnd5e-combat
          path: core
          sparse-checkout: docs/reference

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          DAS_CORE: ${{ github.workspace }}/core
